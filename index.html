<style>

<div class="flex gap-2 items-center">
<div class="flex items-center gap-1 px-2 py-1 rounded-full bg-[#16202e] border border-white/20">
<span class="text-xs">🌐</span>
<select id="langSel" onchange="setLang(this.value)" class="text-xs bg-transparent text-white outline-none">
<option value="en">🇬🇧 English (Default)</option>
<option value="it">🇮🇹 Italiano</option>
<option value="fr">🇫🇷 Français</option>
<option value="es">🇪🇸 Español</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="ru">🇷🇺 Русский</option>
<option value="tr">🇹🇷 Türkçe</option>

<option value="pt">🇧🇷 Português</option>
<option value="ja">🇯🇵 日本語</option>
<option value="ko">🇰🇷 한국어</option>
<option value="zh">🇨🇳 中文</option>
</select>
</div>
<button id="adminBtn" onclick="loginAdmin()" class="text-xs px-4 py-2 rounded-full bg-white text-black font-bold">🔐 Admin</button><button id="logoutBtn" onclick="logoutAdmin()" class="hidden text-xs px-3 py-1.5 rounded-full border border-white/10">Exit</button></div>
</header>
<div class="max-w-[1700px] mx-auto p-4 grid xl:grid-cols-[380px_1fr] gap-6">
<div class="glass rounded-[20px] p-5 h-fit xl:sticky top-[80px] z-20">
<h2 id="t-req" class="font-bold uppercase text-sm">Request Appointment</h2>
<div id="selInfo" class="mt-3 p-3 rounded-xl bg-amber-400 text-black text-xs font-bold hidden"><span id="t-slot">Slot</span>: <span id="selText"></span></div>
<div class="mt-4 space-y-3">
<div><label id="t-alli" class="text-[10px] uppercase text-slate-400">Alliance</label><input id="fAll" value="WAR" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-white/10 text-sm"></div>
<div class="grid grid-cols-2 gap-2"><div><label id="t-id" class="text-[10px] uppercase text-slate-400">Game ID</label><input id="fId" placeholder="123456" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-white/10 text-sm"></div><div><label id="t-name" class="text-[10px] uppercase text-slate-400">In-game Name</label><input id="fName" placeholder="Voldemort" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-white/10 text-sm"></div></div>
<div><label id="t-oro" class="text-[10px] uppercase font-bold text-amber-300">Real Gold Owned</label><input id="fOro" type="text" placeholder="Ex: 1.5M, 300k" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-amber-400/40 text-sm"></div>
<div class="grid grid-cols-2 gap-2"><div><label id="t-day" class="text-[10px] uppercase text-slate-400">Day</label><select id="fGiorno" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-white/10 text-sm"></select></div><div><label id="t-time" class="text-[10px] uppercase text-slate-400">UTC Time</label><select id="fTime" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0b1117] border border-white/10 text-sm"></select></div></div>
<button id="t-btn" onclick="inviaRichiesta()" class="w-full mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 py-3.5 rounded-xl font-bold text-sm">📨 SEND REQUEST</button>
<p id="msg" class="text-xs text-center mt-2 font-bold"></p>
<p id="t-info" class="text-[10px] text-slate-400 text-center mt-3">ℹ️ Request will be sent to Voldemort. You will see your name only after approval.</p>
</div>
<div id="adminPanel" class="hidden mt-6 border-t border-white/10 pt-4">
<h3 class="font-bold text-sm">🔥 <span id="t-pending">Pending Requests</span> (<span id="pendingCount">0</span>)</h3>
<div id="pendingList" class="mt-3 space-y-2 max-h-[400px] overflow-auto"></div>
<h3 class="font-bold text-sm mt-4">✅ <span id="t-approved">Approved</span> (<span id="approvedCount">0</span>)</h3>
<div id="approvedList" class="mt-2 space-y-1 max-h-[200px] overflow-auto"></div>
</div>
</div>
<div class="overflow-hidden">
<h2 class="font-bold mb-2 flex gap-2 items-center">🕐 <span id="t-table">Official LIVE Table</span> <span id="t-only" class="text-[10px] px-2 py-1 rounded bg-green-500/20 text-green-400">Only approved visible</span></h2>
<div class="glass rounded-[16px] overflow-auto max-h-[85vh]">
<table class="border-collapse"><thead><tr id="headRow"><th class="row-h p-3 text-left sticky left-0 top-0 z-30 bg-[#0b1117]">Day / Position</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>
</div>
