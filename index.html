<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regno 1887 - Castle Positions</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#0a0f14;color:#e2e8f0}
.title{font-family:Space Grotesk,sans-serif}
.glass{background:#151e2a;border:1px solid rgba(255,255,255,.06)}
.pos-card{transition:.2s}
.pos-card:hover{border-color:#6366f1}
</style>
</head>
<body>
<header class="border-b border-white/5 bg-[#0a0f14]/80 backdrop-blur sticky top-0 z-20">
<div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center">👑</div>
<div><div class="title font-bold text-sm">REGNO 1887</div><div class="text-[10px] tracking-widest text-slate-400">CASTLE POSITIONS</div></div>
</div>
<button onclick="document.getElementById('createBox').scrollIntoView({behavior:'smooth'})" class="bg-white text-black px-4 py-2 rounded-full text-xs font-semibold">+ New Slot</button>
</div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 grid lg:grid-cols-[360px_1fr] gap-6">
<!-- LEFT -->
<div>
<div id="createBox" class="glass rounded-[20px] p-5">
<h2 class="title font-bold">Create Time Slot</h2>
<p class="text-xs text-slate-400 mt-1 mb-4">For King to set up position reservations</p>
<form id="slotForm" class="space-y-3">
<div class="grid grid-cols-2 gap-2">
<div><label class="text-[10px] uppercase text-slate-400">Date</label><input id="sDate" type="date" required class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0a0f14] border border-white/10 text-sm"></div>
<div><label class="text-[10px] uppercase text-slate-400">Time Slot</label><select id="sTime" class="w-full mt-1 px-3 py-2.5 rounded-xl bg-[#0a0f14] border border-white/10 text-sm"><option>00:00-02:00</option><option>02:00-04:00</option><option>04:00-06:00</option><option>06:00-08:00</option><option>08:00-10:00</option><option>10:00-12:00</option><option>12:00-14:00</option><option>14:00-16:00</option><option>16:00-18:00</option><option>18:00-20:00</option><option>20:00-22:00</option><option>22:00-00:00</option></select></div>
</div>

<div><label class="text-[10px] uppercase text-slate-400">Positions Available (select)</label>
<div class="mt-2 grid grid-cols-1 gap-2">
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Chief Minister" class="posCheck" checked> 👑 Chief Minister</label>
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Noble Counselor" class="posCheck" checked> 🎖️ Noble Counselor</label>
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Defense Minister" class="posCheck" checked> 🛡️ Defense Minister</label>
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Justice Minister" class="posCheck"> ⚖️ Justice Minister</label>
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Interior Minister" class="posCheck"> 🏰 Interior Minister</label>
<label class="flex items-center gap-2 bg-[#0a0f14] border border-white/10 rounded-xl px-3 py-2 text-sm"><input type="checkbox" value="Science Minister" class="posCheck"> 🔬 Science Minister</label>
</div>
</div>

<input id="sNote" placeholder="Min TC level, notes..." class="w-full px-3 py-2.5 rounded-xl bg-[#0a0f14] border border-white/10 text-sm">
<button class="w-full bg-indigo-600 py-3 rounded-xl font-semibold text-sm">Create Slot</button>
</form>
</div>
</div>

<!-- RIGHT -->
<div>
<div class="flex justify-between items-center mb-4">
<h2 class="title text-lg">Position Reservations</h2>
<div class="flex gap-1 bg-[#151e2a] rounded-full p-1 border border-white/5">
<button onclick="filter='all';render()" id="fAll" class="px-3 py-1 rounded-full text-xs bg-white text-black">All</button>
<button onclick="filter='today';render()" id="fToday" class="px-3 py-1 rounded-full text-xs text-slate-400">Today</button>
</div>
</div>
<div id="slotsList" class="space-y-4"></div>
<div id="empty" class="glass rounded-[20px] p-12 text-center">
<div class="text-3xl mb-3">🏰</div>
<h3 class="font-semibold">No time slots yet</h3>
<p class="text-xs text-slate-400 mt-2">King hasn't created any position slots. Create first slot for Chief Minister, Noble Counselor, etc.</p>
</div>
</div>
</main>

<script>
let filter='all';
let slots=JSON.parse(localStorage.getItem('regno_positions')||'[]');
document.getElementById('sDate').valueAsDate=new Date();

document.getElementById('slotForm').addEventListener('submit',e=>{
 e.preventDefault();
 const positions=[...document.querySelectorAll('.posCheck:checked')].map(c=>c.value);
 if(!positions.length){alert('Select at least one position');return;}
 const slot={id:Math.random().toString(36).slice(2,6)+Date.now().toString(36),date:sDate.value,time:sTime.value,positions:positions.map(p=>({name:p,reservedBy:null})),note:sNote.value,created:Date.now()};
 slots.push(slot);localStorage.setItem('regno_positions',JSON.stringify(slots));render();e.target.reset();sDate.valueAsDate=new Date();
 alert('Slot created! Share link: '+location.href.split('#')[0]+'#'+slot.id);
});

function render(){
 const list=document.getElementById('slotsList');list.innerHTML='';
 let data=[...slots];const today=new Date().toISOString().slice(0,10);
 if(filter==='today') data=data.filter(s=>s.date===today);
 document.getElementById('empty').style.display=data.length?'none':'block';
 data.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).forEach(slot=>{
  const div=document.createElement('div');div.className='glass rounded-[20px] p-4';
  div.innerHTML=`
  <div class="flex justify-between items-start">
  <div><div class="flex items-center gap-2"><span class="text-xs px-2 py-1 rounded-full bg-indigo-500/20 text-indigo-300">${slot.date}</span><span class="text-xs px-2 py-1 rounded-full bg-white/10">${slot.time}</span></div>
  <p class="text-[11px] text-slate-400 mt-2">${slot.note||''}</p></div>
  <button onclick="if(confirm('Delete slot?')){slots=slots.filter(s=>s.id!=='${slot.id}');localStorage.setItem('regno_positions',JSON.stringify(slots));render();}" class="text-xs text-slate-500">✕</button>
  </div>
  <div class="mt-4 grid gap-2">
  ${slot.positions.map(pos=>`
   <div class="pos-card flex justify-between items-center bg-[#0a0f14] border ${pos.reservedBy?'border-green-500/30 bg-green-500/5':'border-white/10'} rounded-xl px-3 py-3">
   <span class="text-sm font-medium">${pos.name}</span>
   ${pos.reservedBy? `<span class="text-xs px-2 py-1 rounded-full bg-green-500/20 text-green-300">Reserved by ${pos.reservedBy}</span><button onclick="unreserve('${slot.id}','${pos.name}')" class="text-xs text-slate-400 ml-2">Cancel</button>` : `<button onclick="reserve('${slot.id}','${pos.name}')" class="text-xs px-3 py-1.5 rounded-full bg-white text-black font-medium">Reserve</button>`}
   </div>
  `).join('')}
  </div>
  <div class="mt-3 flex gap-2"><input value="${location.origin+location.pathname.replace('index.html','')}#${slot.id}" readonly class="flex-1 bg-[#0a0f14] border border-white/10 rounded-full px-3 py-1.5 text-[11px] text-slate-400"><button onclick="prompt('Copy link:', '${location.origin+location.pathname.replace('index.html','')}#${slot.id}')" class="text-xs px-3 py-1 rounded-full bg-white/10">Share</button></div>
  `;
  list.appendChild(div);
 });
}

function reserve(slotId,posName){
 const name=prompt('Enter your in-game name to reserve '+posName+':');if(!name)return;
 const slot=slots.find(s=>s.id===slotId);const pos=slot.positions.find(p=>p.name===posName);
 if(pos.reservedBy){alert('Already reserved!');return;}
 pos.reservedBy=name;localStorage.setItem('regno_positions',JSON.stringify(slots));render();
}
function unreserve(slotId,posName){
 const slot=slots.find(s=>s.id===slotId);slot.positions.find(p=>p.name===posName).reservedBy=null;
 localStorage.setItem('regno_positions',JSON.stringify(slots));render();
}
render();
</script>
</body>
</html>
